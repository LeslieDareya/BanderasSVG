<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Banderas con SVG</title>

    <style>
        body {
            margin: 0;
            padding: 10px;
        }

        section {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 65px 50px;
        }

        .bandera {
            width: 150px;
        }

        .bandera h2 {
            margin-bottom: 20px;
        }

        svg {
            box-shadow: 2px 2px 4px 5px #777;
        }

        footer {
            margin-top: 60px;
        }
    </style>

</head>

<body>

    <header>
        <h1>Banderas del mundo con vectores SVG</h1>
    </header>

    <main>

        <section>

            <div class="bandera">
                <h2>Francia</h2>

                <svg width="150" height="100" viewBox="0 0 6 4">
                    <rect width="2" height="4" x="0" y="0" fill="#0055A4"></rect>
                    <rect width="2" height="4" x="2" y="0" fill="#FFFFFF"></rect>
                    <rect width="2" height="4" x="4" y="0" fill="#EF4135"></rect>
                </svg>
            </div>


     
            <div class="bandera">
                <h2>Holanda</h2>

                <svg width="150" height="100" viewBox="0 0 6 4">
                    <rect width="6" height="1.333" x="0" y="0" fill="#AE1C28"></rect>
                    <rect width="6" height="1.333" x="0" y="1.333" fill="#FFFFFF"></rect>
                    <rect width="6" height="1.333" x="0" y="2.666" fill="#21468B"></rect>
                </svg>
            </div>


      
            <div class="bandera">
                <h2>Colombia</h2>

                <svg width="150" height="100" viewBox="0 0 6 4">
                    <rect width="6" height="2" x="0" y="0" fill="#FCD116"></rect>
                    <rect width="6" height="1" x="0" y="2" fill="#003893"></rect>
                    <rect width="6" height="1" x="0" y="3" fill="#CE1126"></rect>
                </svg>
            </div>


            <!-- JAPÓN -->
            <div class="bandera">
                <h2>Japón</h2>

                <svg width="150" height="100" viewBox="0 0 6 4">
                    <rect width="6" height="4" x="0" y="0" fill="#FFFFFF"></rect>
                    <circle cx="3" cy="2" r="1.2" fill="#BC002D"></circle>
                </svg>
            </div>


     
            <div class="bandera">
                <h2>Suiza</h2>

                <svg width="150" height="100" viewBox="0 0 6 4">
                    <rect width="6" height="4" x="0" y="0" fill="#DA291C"></rect>

                    <polygon
                        points="2.3,0.4 3.7,0.4 3.7,1.3 4.6,1.3
                                4.6,2.7 3.7,2.7 3.7,3.6
                                2.3,3.6 2.3,2.7 1.4,2.7
                                1.4,1.3 2.3,1.3"
                        fill="#FFFFFF">
                    </polygon>
                </svg>
            </div>


            <div class="bandera">
                <h2>China</h2>

                <svg width="150" height="100" viewBox="0 0 6 4">

                    <rect width="6" height="4" x="0" y="0" fill="#DE2910"></rect>

                    <polygon
                        points="1.4266,0.4635 0.5706,-0.1854
                                0.8817,-1.2135 0,-0.6000
                                -0.8817,-1.2135 -0.5706,-0.1854
                                -1.4266,0.4635 -0.3527,0.4854
                                0,1.5000 0.3527,0.4854"
                        fill="yellow"
                        transform="translate(1,1) scale(0.4) rotate(180)">
                    </polygon>

                    <polygon
                        points="1.4266,0.4635 0.5706,-0.1854
                                0.8817,-1.2135 0,-0.6000
                                -0.8817,-1.2135 -0.5706,-0.1854
                                -1.4266,0.4635 -0.3527,0.4854
                                0,1.5000 0.3527,0.4854"
                        fill="yellow"
                        transform="translate(2,0.4) scale(0.13) rotate(203)">
                    </polygon>

                    <polygon
                        points="1.4266,0.4635 0.5706,-0.1854
                                0.8817,-1.2135 0,-0.6000
                                -0.8817,-1.2135 -0.5706,-0.1854
                                -1.4266,0.4635 -0.3527,0.4854
                                0,1.5000 0.3527,0.4854"
                        fill="yellow"
                        transform="translate(2.4,0.8) scale(0.13) rotate(225)">
                    </polygon>

                    <polygon
                        points="1.4266,0.4635 0.5706,-0.1854
                                0.8817,-1.2135 0,-0.6000
                                -0.8817,-1.2135 -0.5706,-0.1854
                                -1.4266,0.4635 -0.3527,0.4854
                                0,1.5000 0.3527,0.4854"
                        fill="yellow"
                        transform="translate(2.4,1.4) scale(0.13) rotate(264)">
                    </polygon>

                    <polygon
                        points="1.4266,0.4635 0.5706,-0.1854
                                0.8817,-1.2135 0,-0.6000
                                -0.8817,-1.2135 -0.5706,-0.1854
                                -1.4266,0.4635 -0.3527,0.4854
                                0,1.5000 0.3527,0.4854"
                        fill="yellow"
                        transform="translate(2,1.8) scale(0.13) rotate(288)">
                    </polygon>

                </svg>
            </div>

            <div class="bandera">
                <h2>Panama</h2>

                <svg width="150" height="100" viewBox="0 0 6 4">

                    <rect width="3" height="2" x="0" y="0" fill="#FFFFFF"></rect>
                    <rect width="3" height="2" x="3" y="0" fill="#DA121A"></rect>
                    <rect width="3" height="2" x="0" y="2" fill="#072357"></rect>
                    <rect width="3" height="2" x="3" y="2" fill="#FFFFFF"></rect>

                    <polygon
                        points="1.5,0.5 1.75,1.2 2.5,1.2
                                1.9,1.65 2.1,2.3
                                1.5,1.9 0.9,2.3
                                1.1,1.65 0.5,1.2
                                1.25,1.2"
                        fill="#072357">
                    </polygon>

                    <polygon
                        points="4.5,2.5 4.75,3.2 5.5,3.2
                                4.9,3.65 5.1,4.3
                                4.5,3.9 3.9,4.3
                                4.1,3.65 3.5,3.2
                                4.25,3.2"
                        fill="#DA121A">
                    </polygon>

                </svg>
            </div>

            <div class="bandera">
                <h2>Italia</h2>

                <svg width="150" height="100" viewBox="0 0 6 4">
                    <rect width="2" height="4" x="0" y="0" fill="#009246"></rect>
                    <rect width="2" height="4" x="2" y="0" fill="#FFFFFF"></rect>
                    <rect width="2" height="4" x="4" y="0" fill="#CE2B37"></rect>
                </svg>
            </div>

            <div class="bandera">
                <h2>Inglaterra</h2>

                <svg width="150" height="100" viewBox="0 0 6 4">

                    <rect width="6" height="4" fill="white"></rect>

                    <rect x="2.5" width="1" height="4" fill="#CE1124"></rect>

                    <rect y="1.5" width="6" height="1" fill="#CE1124"></rect>

                </svg>
            </div>

            <div class="bandera">
                <h2>Chile</h2>

                <svg width="150" height="100" viewBox="0 0 6 4">

                    <rect width="6" height="2" x="0" y="2" fill="#CD212A"></rect>

                    <rect width="2" height="2" x="0" y="0" fill="#003893"></rect>

                    <rect width="4" height="2" x="2" y="0" fill="#FFFFFF"></rect>

                    <polygon
                        points="1.4266,0.4635 0.5706,-0.1854
                                0.8817,-1.2135 0,-0.6000
                                -0.8817,-1.2135 -0.5706,-0.1854
                                -1.4266,0.4635 -0.3527,0.4854
                                0,1.5000 0.3527,0.4854"
                        fill="white"
                        transform="translate(1,1) scale(0.4)">
                    </polygon>

                </svg>
            </div>


            <!-- FINLANDIA -->
            <div class="bandera">
                <h2>Finlandia</h2>

                <svg width="150" height="100" viewBox="0 0 6 4">

                    <rect width="6" height="4" x="0" y="0" fill="#FFFFFF"></rect>

                    <rect width="6" height="0.8" x="0" y="1.6" fill="#002F6C"></rect>

                    <rect width="0.8" height="4" x="1.8" y="0" fill="#002F6C"></rect>

                </svg>
            </div>

            <div class="bandera">
                <h2>Alemania</h2>

                <svg width="150" height="100" viewBox="0 0 6 4">

                    <rect width="6" height="1.333" x="0" y="0" fill="#000000"></rect>

                    <rect width="6" height="1.333" x="0" y="1.333" fill="#DD0000"></rect>

                    <rect width="6" height="1.333" x="0" y="2.666" fill="#FFCC00"></rect>

                </svg>
            </div>

            <div class="bandera">
                <h2>Noruega</h2>

                <svg width="150" height="100" viewBox="0 0 6 4">

                    <rect width="6" height="4" x="0" y="0" fill="#EF2B2D"></rect>

                    <rect width="6" height="1" x="0" y="1.5" fill="#FFFFFF"></rect>

                    <rect width="1" height="4" x="1.7" y="0" fill="#FFFFFF"></rect>

                    <rect width="6" height="0.5" x="0" y="1.75" fill="#00205B"></rect>

                    <rect width="0.5" height="4" x="1.95" y="0" fill="#00205B"></rect>

                </svg>
            </div>

        </section>

    </main>

    <footer>
        <p>Todos los derechos reservados &copy; 2026 TSJ</p>
    </footer>

</body>

</html>
